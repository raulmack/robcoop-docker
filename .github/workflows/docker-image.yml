# Construye y publica la imagen del entorno en GitHub Container Registry:
#   ghcr.io/<propietario>/robcoop:humble   (+ etiqueta con la fecha)
# Se ejecuta al cambiar docker/ en main, o a mano desde la pestaña Actions.
# Tras la primera publicación: Packages → robcoop → Package settings → visibilidad "Public".
name: Imagen Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docker/**', '.github/workflows/docker-image.yml']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar espacio en disco (la imagen ocupa ~7 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen en minúsculas
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/robcoop" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./docker
          push: true
          build-args: |
            USER_UID=1000
            USER_GID=1000
          tags: |
            ${{ steps.name.outputs.image }}:humble
            ${{ steps.name.outputs.image }}:humble-${{ steps.name.outputs.date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=ROS 2 Humble + Gazebo Fortress + TurtleBot3 (Robótica Cooperativa)
